sonar.projectKey=k8s-dogu-lib
sonar.projectName=k8s-dogu-lib
sonar.projectVersion=0.0.0-dev

sonar.go.coverage.reportPaths=target/unit-tests/coverage.out,target/k8s-integration-test/report-k8s-integration.out
sonar.go.golangci-lint.reportPaths=target/static-analysis/static-analysis-cs.log

sonar.sources=.

sonar.exclusions=**/mocks/**,**/zz_generated.deepcopy.go,**/*Mock.go,**/client/**

sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=**/vendor/**,**/mocks/**,**/zz_generated.deepcopy.go,**/*Mock.go,**/client/**
# Ignores duplicated code in api/v3beta1 because we want as few dependencies as possible between different versions of the API
sonar.cpd.exclusions=**/api/v3beta1/**
